server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Flutter web SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    default_type application/json;
    return 200 '{"ok":true,"service":"zivo-web"}';
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json;
}
